{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employer Dashboard | CareerConnect</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'jobs/style.css' %}" />
  </head>
  <body>
    <main class="container py-5">
      <h1 class="fw-bold mb-4">Employer Dashboard</h1>

      <p class="text-muted">Manage your posted jobs and applications.</p>

      {% for job in jobs %}
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h5 class="card-title">{{ job.title }}</h5>
          <p>{{ job.company }} — {{ job.location }}</p>

          <a href="{% url 'job_applications' job.id %}" class="btn btn-primary">
            View Applications
          </a>
        </div>
      </div>
      {% empty %}
      <div class="alert alert-info">You haven't posted any jobs yet.</div>
      {% endfor %}
    </main>
  </body>
</html>
